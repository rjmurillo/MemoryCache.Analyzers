name: Main build

on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
    
  workflow_call: # Allow to be called from the release workflow
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false # Coverage upload is skipped when it is not set
  schedule:
    - cron: '31 15 * * 0' # Run periodically to keep CodeQL database updated

permissions:
  security-events: write  # required for CodeQL
  packages: read
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false # Run all OSes, even if one fails, to help narrow down issues that only impact some platforms
      matrix:
        os: [windows-11-arm, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    env:
      IS_COVERAGE_ALLOWED: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ./global.json

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'build/targets/**/Packages.props', '.config/dotnet-tools.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-

    - name: NuGet Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release /p:Deterministic=true /p:UseSharedCompilation=false /p:BuildInParallel=false /nodeReuse:false /bl:./artifacts/logs/release/build.release.binlog

    - name: Test
      run: dotnet test --no-build --configuration Release --settings ./build/targets/tests/test.runsettings

    - name: Package smoke test
      shell: pwsh
      run: ./build/scripts/Invoke-PackageSmokeTest.ps1 -Configuration Release

    - name: Upload binlogs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success() || failure()
      with:
        name: binlogs-${{ matrix.os }}
        path: ./artifacts/logs
        if-no-files-found: error

    - name: Upload *.received.* files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: verify-test-results
        path: |
          **/*.received.*

    - name: Upload SARIF files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success() || failure()
      with:
        name: SARIF files (${{ matrix.os }})
        path: ./artifacts/obj/**/*.sarif

    - name: Upload Test Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success() || failure()
      with:
        name: .NET Test Reports (${{ matrix.os }})
        path: "artifacts/TestResults/**/*.trx"
        if-no-files-found: error

    - name: Upload Code Coverage Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success() || failure()
      with:
        name: .NET Code Coverage Reports (${{ matrix.os }})
        path: "artifacts/TestResults/coverage/**"

    - name: Publish coverage summary to GitHub
      run: cat artifacts/TestResults/coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Upload coverage data to Codacy      
      if: ${{ runner.os == 'Linux' && env.IS_COVERAGE_ALLOWED == 'true' }}
      uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: ${{ github.workspace }}/artifacts/TestResults/coverage/Cobertura.xml

    - name: Upload packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packages-${{ matrix.os }}
        path: |
          ./artifacts/package
        if-no-files-found: error

    - name: Publish step timings
      if: success() || failure()
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        MATRIX_OS: ${{ matrix.os }}
      run: |
        $uri = "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT/jobs?per_page=100"
        $jobs = (gh api $uri | ConvertFrom-Json).jobs
        $job = $jobs | Where-Object { $_.name -like "*build ($env:MATRIX_OS)" } | Select-Object -First 1
        if ($null -eq $job) {
          Write-Error "Could not find the job for $env:MATRIX_OS"
          exit 1
        }
        $rows = foreach ($step in $job.steps) {
          if ($null -ne $step.completed_at -and $null -ne $step.started_at) {
            $seconds = [int]([datetime]$step.completed_at - [datetime]$step.started_at).TotalSeconds
            [pscustomobject]@{ name = $step.name; seconds = $seconds; conclusion = $step.conclusion }
          }
        }
        New-Item -ItemType Directory -Force -Path ./artifacts/timings | Out-Null
        $rows | ConvertTo-Json | Set-Content -Path "./artifacts/timings/step-timings-$env:MATRIX_OS.json"
        "## Step timings ($env:MATRIX_OS)" | Add-Content $env:GITHUB_STEP_SUMMARY
        "" | Add-Content $env:GITHUB_STEP_SUMMARY
        "| Step | Seconds | Result |" | Add-Content $env:GITHUB_STEP_SUMMARY
        "| --- | ---: | --- |" | Add-Content $env:GITHUB_STEP_SUMMARY
        foreach ($row in $rows) {
          "| $($row.name) | $($row.seconds) | $($row.conclusion) |" | Add-Content $env:GITHUB_STEP_SUMMARY
        }

    - name: Upload step timings
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success() || failure()
      with:
        name: step-timings-${{ matrix.os }}
        path: ./artifacts/timings
