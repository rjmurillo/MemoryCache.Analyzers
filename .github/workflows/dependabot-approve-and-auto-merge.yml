name: Auto-Merge Dependabot PRs
# SECURITY: This workflow uses pull_request_target, so it runs in the BASE repo
# context with access to secrets even for fork PRs. Invariants (do not break):
#   1. NEVER check out or execute PR-head code (no actions/checkout of
#      github.event.pull_request.head.*, no building/running PR content).
#   2. NEVER interpolate untrusted PR fields (title, body, branch name) directly
#      into run: blocks. Pass them through env: instead.
# See: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# Renovate PRs need no job here. Renovate enables auto-merge itself through
# platformAutomerge and the per-package rules in renovate.json. The ruleset
# requires no approvals, so this workflow does not approve PRs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  dependabot:
    name: Dependabot
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04-arm
    # Require the bot to be both the PR author and the account that fired the
    # event, and the head branch to live in this repository. This keeps fork
    # PRs and human pushes from enabling auto-merge.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Fail closed unless every commit is authored by the bot, committed by
      # GitHub (web-flow), and carries a GitHub-verified signature. The author
      # login alone comes from the commit email, which anyone can set. This
      # does not stop a user with write access, who can already merge because
      # the ruleset requires no approvals.
      - name: Check commit provenance
        run: |
          commits="$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | "\(.author.login // "unknown") \(.committer.login // "unknown") \(.commit.verification.verified)"' | sort -u)"
          echo "Commits (author committer verified): $(paste -sd, <<< "$commits")"
          if [ "$commits" != "$BOT web-flow true" ]; then
            echo "::error::A commit is not a GitHub-signed commit by $BOT. Not enabling auto-merge."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BOT: dependabot[bot]

      - name: Fetch metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ github.token }}"

      # A merge made with github.token does not trigger push workflows on main.
      # Set the GH_ACTIONS_PR_WRITE secret to a token with pull request write
      # access to keep those runs. Without it, the job falls back to github.token.
      - name: Enable auto-merge for non-major updates
        if: steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PR_WRITE || github.token }}
